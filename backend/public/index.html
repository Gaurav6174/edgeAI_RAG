<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Handbook Bot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="global-nav">
    <span class="global-nav__title">Campus Handbook Bot</span>
    <div class="global-nav__right">
      <span class="global-nav__badge" id="health-badge">connecting…</span>
      <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main class="layout">

    <aside class="sidebar">
      <div class="card">
        <h2 class="card__title">Upload a book</h2>
        <p class="card__hint">Add a PDF to ask questions about it.</p>

        <label class="dropzone" id="dropzone" for="file-input">
          <span id="dropzone-text">Click or drag a PDF here</span>
          <input type="file" id="file-input" accept=".pdf" hidden>
        </label>

        <button class="btn btn--primary btn--block" id="upload-btn" disabled>Upload &amp; Index</button>
        <p class="status-line" id="upload-status"></p>
      </div>

      <div class="card">
        <h2 class="card__title">Your books</h2>
        <ul class="book-list" id="book-list">
          <li class="book-list__empty">No books yet</li>
        </ul>
      </div>

      <div class="card" id="stats-card" hidden>
        <h2 class="card__title">Active book</h2>
        <dl class="stats" id="stats-body"></dl>
      </div>
    </aside>

    <section class="chat-panel">
      <div class="messages" id="messages">
        <div class="empty-state" id="empty-state">
          <p class="empty-state__title">Select a book, then ask it anything</p>
          <p class="empty-state__hint">Answers are generated only from the book you pick — nothing else. Press <kbd>/</kbd> to focus the box, <kbd>↑</kbd> to recall your last question.</p>
        </div>
      </div>

      <form class="composer" id="composer">
        <input
          type="text"
          id="question-input"
          class="composer__input"
          placeholder="Ask a question about the selected book…"
          autocomplete="off"
          disabled
        >
        <button type="submit" class="composer__send" id="send-btn" disabled aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="currentColor"/></svg>
        </button>
      </form>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
